<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <title>Sport 💑 Couple</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{background:#FFFFFF;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#111;min-height:100vh;}
    .app{padding:16px;max-width:420px;margin:0 auto;background:#FFFFFF;min-height:100vh;}

    .user-switch{display:flex;gap:6px;margin-bottom:16px;background:#F0F0F0;padding:3px;border-radius:20px;}
    .user-btn{flex:1;padding:7px 10px;border-radius:17px;border:none;cursor:pointer;font-size:13px;font-weight:600;color:#666;background:transparent;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px;}
    .user-btn.active{background:#FFFFFF;color:#111;box-shadow:0 1px 4px rgba(0,0,0,0.12);}

    .tabs{display:flex;gap:6px;margin-bottom:20px;background:#DEDEDE;padding:4px;border-radius:12px;}
    .tab{flex:1;padding:9px;border-radius:10px;border:none;cursor:pointer;font-size:13px;font-weight:600;color:#444;background:transparent;font-family:inherit;}
    .tab.active{background:#FFFFFF;color:#111;box-shadow:0 1px 4px rgba(0,0,0,0.15);}

    .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
    .header-title{font-size:19px;font-weight:600;color:#111;}
    .header-sub{font-size:12px;color:#666;margin-top:2px;}
    .streak-badge{background:#FFE066;color:#7A4A00;border-radius:20px;padding:5px 11px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px;white-space:nowrap;}

    .week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
    .week-label{font-size:13px;font-weight:600;color:#111;}
    .nav-btn{background:#ECECEC;border:none;border-radius:10px;width:30px;height:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#333;font-size:18px;font-family:inherit;}

    .days-mini{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px;}
    .day-col{display:flex;flex-direction:column;align-items:center;gap:4px;}
    .day-name{font-size:9px;color:#777;text-transform:uppercase;letter-spacing:0.5px;}
    .day-num{font-size:12px;font-weight:600;color:#111;}
    .day-dot{width:7px;height:7px;border-radius:50%;background:#DDD;}
    .day-dot.status-done{background:#18A85C;}
    .day-dot.status-missed{background:#E83030;}
    .day-dot.today-dot{background:#2A7EE8;}

    .section-title{font-size:11px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:0.7px;margin-bottom:8px;}
    .evenings{display:flex;flex-direction:column;gap:5px;margin-bottom:16px;}

    .ev-card{border-radius:12px;padding:9px 12px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:46px;}
    .ev-card.act-none{background:#F7F7F7;border:1.5px solid #E8E8E8;}
    .ev-card.act-course{background:#18A85C;}
    .ev-card.act-renfo{background:#E8C000;}
    .ev-card.act-salle{background:#F07800;}
    .ev-card.act-copines{background:#E8006A;}
    .ev-card.act-repos{background:#BBBBBB;}

    .ev-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
    .ev-emoji{font-size:16px;flex-shrink:0;}
    .ev-info{flex:1;min-width:0;}
    .ev-day{font-size:13px;font-weight:600;white-space:nowrap;}
    .ev-act{font-size:11px;margin-top:1px;white-space:nowrap;}

    .ev-card.act-none .ev-day{color:#222;}
    .ev-card.act-none .ev-act{color:#AAA;}
    .ev-card.act-course .ev-day,.ev-card.act-course .ev-act{color:#E8FFF2;}
    .ev-card.act-renfo .ev-day,.ev-card.act-renfo .ev-act{color:#3D2E00;}
    .ev-card.act-salle .ev-day,.ev-card.act-salle .ev-act{color:#3D1800;}
    .ev-card.act-copines .ev-day,.ev-card.act-copines .ev-act{color:#FFFFFF;}
    .ev-card.act-repos .ev-day,.ev-card.act-repos .ev-act{color:#222;}

    .ev-right{display:flex;align-items:center;gap:5px;flex-shrink:0;}
    .status-btn{width:28px;height:28px;border-radius:50%;border:2px solid rgba(0,0,0,0.15);background:rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;font-weight:700;color:rgba(0,0,0,0.3);}
    .ev-card.act-none .status-btn{background:#EBEBEB;border-color:#CCC;color:#999;}
    .status-btn.active-done{background:#18A85C !important;border-color:#18A85C !important;color:#FFF !important;}
    .status-btn.active-missed{background:#E83030 !important;border-color:#E83030 !important;color:#FFF !important;}

    .progress-box{border-radius:14px;padding:12px 14px;margin-bottom:10px;background:#F0EEFF;border:1.5px solid #C8B8FF;}
    .progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
    .progress-label{font-size:13px;color:#333;font-weight:500;}
    .progress-count{font-size:14px;font-weight:700;color:#5B38C2;}
    .progress-bar{height:7px;background:#DDD4FF;border-radius:4px;overflow:hidden;}
    .progress-fill{height:100%;background:linear-gradient(90deg,#7B5CF0,#E879A0);border-radius:4px;transition:width 0.4s;}

    .motivation-box{border-radius:14px;padding:10px 14px;margin-bottom:16px;background:#FFF0F6;border:1.5px solid #FFB0D4;}
    .motivation-box p{font-size:12px;color:#8C1A4E;line-height:1.5;font-weight:500;}

    .badges-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px;}
    .badge-card{border-radius:12px;padding:10px;display:flex;align-items:center;gap:8px;background:#FFFFFF;border:2px solid #EBEBEB;}
    .badge-card.unlocked{border-color:#FFD700;background:#FFFBEA;}
    .badge-card.locked{opacity:0.4;}
    .badge-icon-wrap{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:#F0F0F0;}
    .badge-card.unlocked .badge-icon-wrap{background:#FFF3C2;}
    .badge-name{font-size:11px;font-weight:600;color:#222;}
    .badge-desc{font-size:10px;color:#777;margin-top:1px;line-height:1.3;}

    .week-view{display:none;}
    .week-view.active{display:block;}
    .cal-view{display:none;}
    .cal-view.active{display:block;}
    .stats-view{display:none;}
    .stats-view.active{display:block;}

    .month-accordion{border:1.5px solid #E0E0E0;border-radius:14px;margin-bottom:10px;overflow:hidden;background:#FFFFFF;}
    .month-header{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;cursor:pointer;background:#FFFFFF;}
    .month-header:hover{background:#FAFAFA;}
    .month-name{font-size:14px;font-weight:600;color:#111;}
    .month-meta{display:flex;align-items:center;gap:10px;}
    .month-count{font-size:12px;color:#555;}
    .month-chevron{font-size:12px;color:#888;transition:transform 0.2s;display:inline-block;}
    .month-chevron.open{transform:rotate(180deg);}
    .month-body{display:none;padding:0 12px 14px;}
    .month-body.open{display:block;}
    .cal-hdr-row{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px;}
    .cal-day-hdr{font-size:9px;color:#888;text-align:center;text-transform:uppercase;padding:3px 0;font-weight:600;}
    .cal-days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
    .cal-cell{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;}
    .cal-cell.empty{cursor:default;pointer-events:none;}
    .cal-num{width:100%;aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#555;background:#F0F0F0;}
    .cal-cell.act-course .cal-num{background:#18A85C;color:#E8FFF2;}
    .cal-cell.act-renfo .cal-num{background:#E8C000;color:#3D2E00;}
    .cal-cell.act-salle .cal-num{background:#F07800;color:#3D1800;}
    .cal-cell.act-copines .cal-num{background:#E8006A;color:#FFFFFF;}
    .cal-cell.act-repos .cal-num{background:#BBBBBB;color:#222;}
    .cal-cell.today-cal .cal-num{outline:2.5px solid #2A7EE8;outline-offset:1px;}
    .cal-dot{width:6px;height:6px;border-radius:50%;background:transparent;}
    .cal-dot.dot-done{background:#18A85C;}
    .cal-dot.dot-missed{background:#E83030;}
    .legend{display:flex;gap:12px;margin-bottom:12px;align-items:center;}
    .legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#555;font-weight:500;}
    .legend-dot{width:9px;height:9px;border-radius:50%;}

    .stats-month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
    .stats-month-label{font-size:14px;font-weight:600;color:#111;}
    .stat-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px;}
    .stat-card{background:#F8F8F8;border-radius:12px;padding:12px;border:1px solid #EBEBEB;}
    .stat-val{font-size:22px;font-weight:700;color:#111;margin-bottom:2px;}
    .stat-label{font-size:11px;color:#777;font-weight:500;}
    .stat-card.green .stat-val{color:#18A85C;}
    .stat-card.purple .stat-val{color:#5B38C2;}
    .stat-card.orange .stat-val{color:#F07800;}
    .stat-card.pink .stat-val{color:#E8006A;}
    .stats-bar-title{font-size:11px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;}
    .act-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
    .act-bar-label{font-size:12px;color:#333;width:80px;flex-shrink:0;}
    .act-bar-track{flex:1;height:10px;background:#F0F0F0;border-radius:5px;overflow:hidden;}
    .act-bar-fill{height:100%;border-radius:5px;transition:width 0.4s;}
    .act-bar-count{font-size:12px;font-weight:600;color:#555;width:20px;text-align:right;flex-shrink:0;}
    .heatmap-row{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
    .heatmap-cell{aspect-ratio:1;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:#888;background:#F0F0F0;}
    .heatmap-cell.h-done{background:#18A85C;color:#E8FFF2;}
    .heatmap-cell.h-missed{background:#FFDDDD;color:#E83030;}
    .heatmap-cell.h-planned{background:#E8E8E8;color:#AAA;}

    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:flex-end;justify-content:center;}
    .modal-overlay.open{display:flex;}
    .modal{background:#FFFFFF;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:420px;}
    .modal-title{font-size:15px;font-weight:600;margin-bottom:16px;color:#111;}
    .act-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
    .act-btn{padding:18px 8px;border-radius:14px;border:none;cursor:pointer;font-size:14px;font-weight:700;text-align:center;display:flex;flex-direction:column;align-items:center;gap:7px;font-family:inherit;}
    .act-btn-emoji{font-size:26px;display:block;}
    .act-btn.course{background:#18A85C;color:#000;}
    .act-btn.renfo{background:#E8C000;color:#000;}
    .act-btn.salle{background:#F07800;color:#000;}
    .act-btn.copines{background:#E8006A;color:#000;}
    .act-btn.repos{background:#AAAAAA;color:#000;}
    .act-btn:hover{filter:brightness(0.92);}
    .modal-footer{display:flex;gap:8px;}
    .modal-cancel{flex:1;padding:13px;background:#EEEEEE;border:none;border-radius:12px;cursor:pointer;font-size:14px;color:#333;font-weight:600;font-family:inherit;}
    .modal-delete{padding:13px 16px;background:#FFE8E8;border:none;border-radius:12px;cursor:pointer;font-size:14px;color:#C00;font-weight:600;font-family:inherit;display:none;}
    .modal-delete.visible{display:block;}
  </style>
</head>
<body>
<div class="app">
  <div class="user-switch">
    <button class="user-btn active" id="user-emilie" onclick="switchUser('emilie')">👩 Émilie</button>
    <button class="user-btn" id="user-martin" onclick="switchUser('martin')">👨 Martin</button>
  </div>
  <div class="header">
    <div><div class="header-title" id="header-title">Salut Émilie ! 👋</div><div class="header-sub">On bouge cette semaine ?</div></div>
    <div class="streak-badge">🔥 <span id="streak-count">0</span> jours</div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('week')" id="tab-week">Semaine</button>
    <button class="tab" onclick="switchTab('cal')" id="tab-cal">Calendrier</button>
    <button class="tab" onclick="switchTab('stats')" id="tab-stats">Stats</button>
  </div>

  <div class="week-view active" id="week-view">
    <div class="week-nav">
      <button class="nav-btn" onclick="changeWeek(-1)">&#8249;</button>
      <span class="week-label" id="week-label"></span>
      <button class="nav-btn" onclick="changeWeek(1)">&#8250;</button>
    </div>
    <div class="days-mini" id="days-mini"></div>
    <div class="section-title">Soirées</div>
    <div class="evenings" id="evenings-list"></div>
    <div class="progress-box">
      <div class="progress-row"><span class="progress-label">Séances réalisées</span><span class="progress-count" id="progress-count">0 / 0</span></div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
    <div class="motivation-box"><p id="motivation-text">Planifie tes soirées !</p></div>
    <div class="section-title">Badges de la semaine</div>
    <div class="badges-grid" id="badges-grid"></div>
  </div>

  <div class="cal-view" id="cal-view">
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#18A85C"></div>Réalisé</div>
      <div class="legend-item"><div class="legend-dot" style="background:#E83030"></div>Non réalisé</div>
      <div class="legend-item"><div class="legend-dot" style="background:#DDD"></div>Planifié</div>
    </div>
    <div id="year-accordion"></div>
  </div>

  <div class="stats-view" id="stats-view">
    <div class="stats-month-nav">
      <button class="nav-btn" onclick="changeStatsMonth(-1)">&#8249;</button>
      <span class="stats-month-label" id="stats-month-label"></span>
      <button class="nav-btn" onclick="changeStatsMonth(1)">&#8250;</button>
    </div>
    <div class="stat-cards" id="stat-cards"></div>
    <div style="margin-bottom:16px"><div class="stats-bar-title">Répartition des activités</div><div id="act-bars"></div></div>
    <div>
      <div class="stats-bar-title">Calendrier du mois</div>
      <div class="cal-hdr-row" style="margin-bottom:4px">
        <div class="cal-day-hdr">L</div><div class="cal-day-hdr">M</div><div class="cal-day-hdr">M</div>
        <div class="cal-day-hdr">J</div><div class="cal-day-hdr">V</div><div class="cal-day-hdr">S</div><div class="cal-day-hdr">D</div>
      </div>
      <div class="heatmap-row" id="heatmap-grid"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modal-title">Que prévois-tu ?</div>
    <div class="act-grid">
      <button class="act-btn course" onclick="selectActivity('course')"><span class="act-btn-emoji">🏃</span>Course</button>
      <button class="act-btn renfo" onclick="selectActivity('renfo')"><span class="act-btn-emoji">🏋️</span>Renfo musculaire</button>
      <button class="act-btn salle" onclick="selectActivity('salle')"><span class="act-btn-emoji">🏢</span>Salle</button>
      <button class="act-btn copines" onclick="selectActivity('copines')"><span class="act-btn-emoji">👯</span>Sortie copines</button>
      <button class="act-btn repos" onclick="selectActivity('repos')"><span class="act-btn-emoji">😴</span>Repos</button>
    </div>
    <div class="modal-footer">
      <button class="modal-cancel" onclick="closeModal()">Annuler</button>
      <button class="modal-delete" id="modal-delete" onclick="deleteFromModal()">✕ Supprimer</button>
    </div>
  </div>
</div>

<script>
const DAYS_SHORT=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const DAYS_FULL=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const MONTHS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const ACT_LABELS={course:'Course',renfo:'Renfo',salle:'Salle',copines:'Copines',repos:'Repos'};
const ACT_EMOJI={course:'🏃',renfo:'🏋️',salle:'🏢',copines:'👯',repos:'😴'};
const ACT_COLORS={course:'#18A85C',renfo:'#E8C000',salle:'#F07800',copines:'#E8006A',repos:'#BBBBBB'};
const SPORT_ACTS=['course','renfo','salle'];

let weekOffset=0,selectedKey=null,currentUser='emilie',statsMonthOffset=0;

function storageKey(){return 'sport_couple_'+currentUser;}
function getData(){return JSON.parse(localStorage.getItem(storageKey())||'{}');}
function saveData(d){localStorage.setItem(storageKey(),JSON.stringify(d));}
function dateKey(d){return d.toISOString().slice(0,10);}
function todayKey(){return dateKey(new Date());}
function getWeekDates(off){
  const now=new Date(),dow=now.getDay(),mon=new Date(now);
  mon.setDate(now.getDate()-(dow===0?6:dow-1)+off*7);
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
}
function getWeekOffsetForDate(dateStr){
  const target=new Date(dateStr),now=new Date(),dow=now.getDay(),mon=new Date(now);
  mon.setDate(now.getDate()-(dow===0?6:dow-1));mon.setHours(0,0,0,0);
  const tdow=target.getDay(),tm=new Date(target);
  tm.setDate(target.getDate()-(tdow===0?6:tdow-1));tm.setHours(0,0,0,0);
  return Math.round((tm-mon)/604800000);
}

function switchUser(u){
  currentUser=u;
  document.getElementById('user-emilie').classList.toggle('active',u==='emilie');
  document.getElementById('user-martin').classList.toggle('active',u==='martin');
  document.getElementById('header-title').textContent=u==='emilie'?'Salut Émilie ! 👋':'Salut Martin ! 👋';
  renderWeek();
  if(document.getElementById('cal-view').classList.contains('active'))renderCalendar();
  if(document.getElementById('stats-view').classList.contains('active'))renderStats();
}
function switchTab(t){
  ['week','cal','stats'].forEach(v=>{
    document.getElementById(v+'-view').classList.toggle('active',t===v);
    document.getElementById('tab-'+v).classList.toggle('active',t===v);
  });
  if(t==='cal')renderCalendar();
  if(t==='stats')renderStats();
}
function changeWeek(d){weekOffset+=d;renderWeek();}

function renderWeek(){
  const data=getData(),dates=getWeekDates(weekOffset),today=todayKey();
  const fmt=d=>d.getDate()+' '+d.toLocaleString('fr-FR',{month:'short'});
  document.getElementById('week-label').textContent=fmt(dates[0])+' – '+fmt(dates[6]);
  const mini=document.getElementById('days-mini');mini.innerHTML='';
  dates.forEach((d,i)=>{
    const key=dateKey(d),e=data[key]||{};
    let dotCls=key===today?'today-dot':'';
    if(e.status==='done')dotCls='status-done';
    else if(e.status==='missed')dotCls='status-missed';
    const col=document.createElement('div');col.className='day-col';
    col.innerHTML='<div class="day-name">'+DAYS_SHORT[i]+'</div><div class="day-num">'+d.getDate()+'</div><div class="day-dot '+dotCls+'"></div>';
    mini.appendChild(col);
  });
  const list=document.getElementById('evenings-list');list.innerHTML='';
  dates.forEach((d,i)=>{
    const key=dateKey(d),e=data[key]||{},act=e.activity||'none';
    const card=document.createElement('div');card.className='ev-card act-'+act;
    const doneActive=e.status==='done'?'active-done':'';
    const missedActive=e.status==='missed'?'active-missed':'';
    const emoji=e.activity?ACT_EMOJI[e.activity]:'·';
    const actLabel=e.activity?ACT_LABELS[e.activity]:'Planifier';
    card.innerHTML='<div class="ev-left"><span class="ev-emoji">'+emoji+'</span><div class="ev-info"><div class="ev-day">'+DAYS_FULL[i]+'</div><div class="ev-act">'+actLabel+'</div></div></div><div class="ev-right"><div class="status-btn '+doneActive+'" data-key="'+key+'" data-status="done">✓</div><div class="status-btn '+missedActive+'" data-key="'+key+'" data-status="missed">✕</div></div>';
    card.querySelectorAll('.status-btn').forEach(btn=>{
      btn.addEventListener('click',ev=>{
        ev.stopPropagation();
        const d2=getData(),k=btn.dataset.key,s=btn.dataset.status;
        if(!d2[k])d2[k]={};
        d2[k].status=d2[k].status===s?null:s;
        saveData(d2);renderWeek();
      });
    });
    card.addEventListener('click',()=>openModal(key,DAYS_FULL[i]));
    list.appendChild(card);
  });
  updateProgress(dates);renderBadges(dates);updateMotivation(dates);
  document.getElementById('streak-count').textContent=getMaxStreak();
}

function openModal(key,dayName){
  selectedKey=key;
  document.getElementById('modal-title').textContent=dayName+' — que prévois-tu ?';
  const data=getData();
  document.getElementById('modal-delete').classList.toggle('visible',!!(data[key]&&data[key].activity));
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open');selectedKey=null;}
function deleteFromModal(){
  if(!selectedKey)return;
  const d=getData();if(d[selectedKey]){delete d[selectedKey].activity;d[selectedKey].status=null;}
  saveData(d);closeModal();renderWeek();
}
function selectActivity(act){
  if(!selectedKey)return;
  const d=getData();if(!d[selectedKey])d[selectedKey]={};
  d[selectedKey].activity=act;saveData(d);closeModal();renderWeek();
  if(document.getElementById('cal-view').classList.contains('active'))renderCalendar();
}

function updateProgress(dates){
  const data=getData();
  const planned=dates.filter(d=>SPORT_ACTS.includes((data[dateKey(d)]||{}).activity)).length;
  const done=dates.filter(d=>(data[dateKey(d)]||{}).status==='done'&&SPORT_ACTS.includes((data[dateKey(d)]||{}).activity)).length;
  document.getElementById('progress-count').textContent=done+' / '+planned;
  document.getElementById('progress-fill').style.width=(planned>0?Math.round(done/planned*100):0)+'%';
}

function getToday(dates){
  const today=todayKey();
  return dates.find(d=>dateKey(d)===today)||null;
}

function updateMotivation(dates){
  const data=getData(),name=currentUser==='emilie'?'Émilie':'Martin';
  const sp=dates.filter(d=>SPORT_ACTS.includes((data[dateKey(d)]||{}).activity)).length;
  const done=dates.filter(d=>(data[dateKey(d)]||{}).status==='done'&&SPORT_ACTS.includes((data[dateKey(d)]||{}).activity)).length;

  // Cherche l'activité du jour
  const todayDate=getToday(dates);
  const todayAct=todayDate?(data[dateKey(todayDate)]||{}).activity:null;

  let msg;
  if(todayAct&&FUNNY[todayAct]){
    const phrases=FUNNY[todayAct];
    msg=phrases[Math.floor(Math.random()*phrases.length)];
  } else if(sp===0){
    msg='Planifie tes soirées pour commencer !';
  } else if(done>0&&done===sp){
    msg='Semaine parfaite — tu déchires '+name+' ! 🏆';
  } else if(done>=3){
    msg='Continue comme ça '+name+' ! 💪';
  } else {
    msg='Chaque séance compte — allez '+name+' ! 🔥';
  }
  document.getElementById('motivation-text').textContent=msg;
}

function renderBadges(dates){
  const data=getData(),grid=document.getElementById('badges-grid');grid.innerHTML='';
  BADGES_DEF.forEach(b=>{
    const u=b.check(dates,data),card=document.createElement('div');
    card.className='badge-card '+(u?'unlocked':'locked');
    card.innerHTML='<div class="badge-icon-wrap">'+b.icon+'</div><div><div class="badge-name">'+b.name+'</div><div class="badge-desc">'+b.desc+'</div></div>';
    grid.appendChild(card);
  });

function getMaxStreak(){
  const data=getData(),keys=Object.keys(data).filter(k=>data[k].status==='done'&&SPORT_ACTS.includes(data[k].activity)).sort();
  let max=0,cur=0,prev=null;
  keys.forEach(k=>{const d=new Date(k);if(prev){const diff=(d-prev)/86400000;if(diff===1){cur++;max=Math.max(max,cur);}else cur=1;}else cur=1;prev=d;max=Math.max(max,cur);});
  return max;
}
function getWeekStreak(){
  const data=getData(),dates=getWeekDates(weekOffset);let max=0,cur=0;
  dates.forEach(d=>{const e=data[dateKey(d)]||{};if(e.status==='done'&&SPORT_ACTS.includes(e.activity)){cur++;max=Math.max(max,cur);}else cur=0;});
  return max;
}

function renderCalendar(){
  const data=getData(),container=document.getElementById('year-accordion');container.innerHTML='';
  const year=2026,today=todayKey(),cm=new Date().getMonth();
  for(let m=0;m<12;m++){
    const firstDay=new Date(year,m,1),lastDay=new Date(year,m+1,0);
    const startDow=(firstDay.getDay()+6)%7,totalDays=lastDay.getDate();
    let doneCount=0;
    for(let day=1;day<=totalDays;day++){const k=year+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');if((data[k]||{}).status==='done'&&SPORT_ACTS.includes((data[k]||{}).activity))doneCount++;}
    const acc=document.createElement('div');acc.className='month-accordion';
    const isOpen=m===cm;
    acc.innerHTML='<div class="month-header"><span class="month-name">'+MONTHS[m]+' '+year+'</span><div class="month-meta"><span class="month-count">'+doneCount+' séance'+(doneCount!==1?'s':'')+'</span><span class="month-chevron '+(isOpen?'open':'')+'">▼</span></div></div><div class="month-body '+(isOpen?'open':'')+'"><div class="cal-hdr-row">'+DAYS_SHORT.map(d=>'<div class="cal-day-hdr">'+d[0]+'</div>').join('')+'</div><div class="cal-days-grid" id="cal-grid-'+m+'"></div></div>';
    acc.querySelector('.month-header').addEventListener('click',()=>{const b=acc.querySelector('.month-body'),c=acc.querySelector('.month-chevron'),o=b.classList.contains('open');b.classList.toggle('open',!o);c.classList.toggle('open',!o);});
    container.appendChild(acc);
    const grid=acc.querySelector('#cal-grid-'+m);
    for(let i=0;i<startDow;i++){const e=document.createElement('div');e.className='cal-cell empty';e.innerHTML='<div class="cal-num" style="background:transparent;color:transparent">0</div><div class="cal-dot"></div>';grid.appendChild(e);}
    for(let day=1;day<=totalDays;day++){
      const k=year+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0'),e=data[k]||{};
      const cell=document.createElement('div');
      let cls='cal-cell';if(e.activity)cls+=' act-'+e.activity;if(k===today)cls+=' today-cal';
      let dotCls='cal-dot';if(e.status==='done')dotCls+=' dot-done';else if(e.status==='missed')dotCls+=' dot-missed';
      cell.className=cls;cell.innerHTML='<div class="cal-num">'+day+'</div><div class="'+dotCls+'"></div>';
      cell.addEventListener('click',()=>{weekOffset=getWeekOffsetForDate(k);switchTab('week');renderWeek();});
      grid.appendChild(cell);
    }
  }
}

function changeStatsMonth(d){statsMonthOffset+=d;renderStats();}
function renderStats(){
  const data=getData();
  const now=new Date(),m=new Date(now.getFullYear(),now.getMonth()+statsMonthOffset,1);
  const year=m.getFullYear(),month=m.getMonth();
  document.getElementById('stats-month-label').textContent=MONTHS[month]+' '+year;
  const lastDay=new Date(year,month+1,0).getDate();
  let totalPlanned=0,totalDone=0,totalMissed=0;
  const actCount={course:0,renfo:0,salle:0,copines:0,repos:0};
  for(let day=1;day<=lastDay;day++){
    const k=year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const e=data[k]||{};
    if(e.activity){totalPlanned++;if(e.status==='done'){totalDone++;actCount[e.activity]=(actCount[e.activity]||0)+1;}else if(e.status==='missed')totalMissed++;}
  }
  const pct=totalPlanned>0?Math.round(totalDone/totalPlanned*100):0;
  document.getElementById('stat-cards').innerHTML='<div class="stat-card green"><div class="stat-val">'+totalDone+'</div><div class="stat-label">Séances réalisées</div></div><div class="stat-card purple"><div class="stat-val">'+pct+'%</div><div class="stat-label">Taux de réussite</div></div><div class="stat-card orange"><div class="stat-val">'+totalPlanned+'</div><div class="stat-label">Planifiées</div></div><div class="stat-card pink"><div class="stat-val">'+totalMissed+'</div><div class="stat-label">Manquées</div></div>';
  const maxCount=Math.max(1,...Object.values(actCount));
  const bars=document.getElementById('act-bars');bars.innerHTML='';
  Object.entries(actCount).forEach(([act,count])=>{
    if(count===0)return;
    const row=document.createElement('div');row.className='act-bar-row';
    row.innerHTML='<div class="act-bar-label">'+ACT_EMOJI[act]+' '+ACT_LABELS[act]+'</div><div class="act-bar-track"><div class="act-bar-fill" style="width:'+Math.round(count/maxCount*100)+'%;background:'+ACT_COLORS[act]+'"></div></div><div class="act-bar-count">'+count+'</div>';
    bars.appendChild(row);
  });
  const heatmap=document.getElementById('heatmap-grid');heatmap.innerHTML='';
  const startDow=(new Date(year,month,1).getDay()+6)%7;
  for(let i=0;i<startDow;i++){const e=document.createElement('div');e.className='heatmap-cell';e.style.background='transparent';heatmap.appendChild(e);}
  for(let day=1;day<=lastDay;day++){
    const k=year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0'),e=data[k]||{};
    const cell=document.createElement('div');
    let cls='heatmap-cell';
    if(e.status==='done')cls+=' h-done';else if(e.status==='missed')cls+=' h-missed';else if(e.activity)cls+=' h-planned';
    cell.className=cls;cell.textContent=day;heatmap.appendChild(cell);
  }
}
